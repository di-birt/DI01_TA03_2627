  Implementa los TODOs siguiendo los apartados indicados en la teoría.

<!-- TODO (Apartado 1): Encabezado con ion-header, ion-toolbar e ion-title -->
<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      <!-- TODO: Escribe aquí el nombre de tu aplicación -->
       Mi Aplicación
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- TODO (Apartado 3 – Two-way Binding):
       Añadir un ion-item con ion-input para filtrar la lista en tiempo real.
       - Usa [(ngModel)]="busqueda" en el ion-input.
       - Añade un placeholder descriptivo.
       Referencia de la teoría (apartado 3 – Two-way Binding):
         <ion-input [(ngModel)]="nombre"></ion-input>
  -->
  <ion-item>
    <ion-input [(ngModel)]="busqueda" placeholder="Buscar elemento..."></ion-input>
  </ion-item>

  <!-- TODO (Apartado 1 + 2 + 3):
       Lista de elementos.
       - Usa <ion-list> como contenedor.
       - Itera sobre elementosFiltrados con @for (apartado 4 de la teoría, ya disponible).
       - Cada fila: <ion-item (click)="verDetalle(elemento)"> con <ion-label>.
         · <h2> con el nombre del elemento.
         · <p> con la descripción.
       - Muestra al menos 5 elementos (defínelos en home.page.ts).

       Referencia de la teoría (apartado 1 – ion-list, ion-item, ion-label):
         <ion-list>
           <ion-item>
             <ion-label>
               <h2>Nombre</h2>
               <p>Descripción</p>
             </ion-label>
           </ion-item>
         </ion-list>
  -->
  <ion-list>
    @for (elemento of elementosFiltrados; track elemento.id) {
      <ion-item button="true" (click)="verDetalle(elemento)">
        <ion-label>
          <h2>{{ elemento.nombre }}</h2>
          <p>{{ elemento.descripcion }}</p>
        </ion-label>
      </ion-item>
    }
  </ion-list>

  <!-- TODO (Apartado 1 + 3 – Event Binding + Property Binding):
       Añadir un <ion-button> que:
       · Al pulsarlo llame a mostrarToast()     → (click)="mostrarToast()"
       · Esté deshabilitado si no hay elementos → [disabled]="!hayElementos"

       Referencia de la teoría (apartado 3 – Event Binding y Property Binding):
         <ion-button [disabled]="!formValido" (click)="guardar()">Guardar</ion-button>
  -->
  <ion-button expand="block" [disabled]="!hayElementos" (click)="mostrarToast()">
    Mostrar mensaje
  </ion-button>

</ion-content>

  </ion-toolbar>
