<!--
  TAREA TA01 – DetallePage
  Implementa los TODOs siguiendo los apartados indicados en la teoría.
-->

<!-- TODO (Apartado 1 + 2): Encabezado con ion-back-button y título del elemento seleccionado -->
<ion-header [translucent]="true">
  <ion-toolbar>

    <!-- TODO (Apartado 2):
         Añadir <ion-buttons slot="start"> con <ion-back-button defaultHref="/home">
         Estructura de referencia (teoría, apartado 2 – ion-back-button):
         <ion-buttons slot="start">
           <ion-back-button defaultHref="/home"></ion-back-button>
         </ion-buttons>
    -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>

    <ion-title>{{ elementoDetalle?.nombre }}</ion-title>

    <!-- TODO (Apartado 3 – Interpolación):
         Mostrar el nombre del elemento en el título usando {{ elementoDetalle?.nombre }}
    -->
    <ion-title>Detalle</ion-title>

  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <!-- TODO (Apartado 1 + 3 – Interpolación):
       Mostrar los datos del elemento seleccionado.

       Estructura sugerida:
       <ion-list>
         <ion-item>
           <ion-label>
             <h2>{{ elementoDetalle.nombre }}</h2>
             <p>{{ elementoDetalle.descripcion }}</p>
           </ion-label>
         </ion-item>
         <ion-item>
           <ion-label>Categoría: {{ elementoDetalle.categoria }}</ion-label>
         </ion-item>
       </ion-list>

       Si no hay elemento seleccionado, muestra un mensaje informativo.
  -->
  @if (elementoDetalle) {
    <ion-list>
      <ion-item>
        <ion-label>
          <h2>{{ elementoDetalle.nombre }}</h2>
          <p>{{ elementoDetalle.descripcion }}</p>
        </ion-label>
      </ion-item>
      <ion-item>
        <ion-label>Categoría: {{ elementoDetalle.categoria }}</ion-label>
      </ion-item>
    </ion-list>
  } @else {
    <ion-item>
      <ion-label>No se ha seleccionado ningún elemento.</ion-label>
    </ion-item>
  }

</ion-content>
